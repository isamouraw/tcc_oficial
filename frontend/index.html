<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineTrack</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
   <header>

        <h1>CineTrack</h1>

        <nav>

            <a href="#">Home</a>

            <a href="# ">Entrar</a>

            <a href="# ">Criar uma conta</a>

            <a href="#">Filmes</a>

            <a href="#">Séries</a>

            <a href="#">Minha Lista</a>

        </nav>

    </header>

    <section class="banner">

        <h2>Encontre Filmes e Séries</h2>

        <p>Uma plataforma  interativa para amantes do entretenimento</p>

        <button>Explorar Catálogo</button>

    </section>

    <section class="filtros">

        <h2></h2>

        <button>Favoritos</button>

        <button>Minhas avaliações</button>

        <button>Recomendações</button>

    </section>

    <section class="destaques">

        <h2>Em Destaque</h2>

        <div class="cards">

            <div class="card">

                <img src="../assets/" alt="Poster">

                <p>Interestelar</p>

            </div>

            <div class="card">

                <img src="https://via.placeholder.com/200x300" alt="Poster">

                <p>Stranger Things</p>

            </div>

            <div class="card">

                <img src="https://via.placeholder.com/200x300" alt="Poster">

                <p>Breaking Bad</p>

            </div>

        </div>

    </section>

    <footer>

        <p>© 2026 CineTrack - Todos os direitos reservados</p>

    </footer>
</body>
</html>
