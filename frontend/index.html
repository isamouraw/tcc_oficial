<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineTrack</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
   <header>

        <h1>CineTrack</h1>


        <nav>

            <button onclick="window.location.href='index.html'">Home</button>

            <button onclick="window.location.href='Entrar.html'">Entrar</button>

            <button onclick="window.location.href='login.html'">Login</button>

            <button onclick="window.location.href='Filmes.html'">Filmes</button>

            <button onclick="window.location.href='lista.html'">Lista</button>

        </nav>

        <div class="pesquisa">

            <input type="text" placeholder="Buscar filmes...">
        
            <button>🔍</button>
        
        </div>

        <div class="usuario-menu">

            <button class="perfil-btn">👤</button>
        
            <div class="menu-dropdown">
        
                <button>Editar Perfil</button>
        
                <button>Configurações</button>
        
                <button>Bloquear Usuário</button>
        
                <button>Sair da Conta</button>
        
            </div>
        
        </div>

    </header>

    <section class="banner">

        <h2>Encontre Filmes </h2>

        <p>Uma plataforma  interativa para amantes do entretenimento</p>

        <button>Explorar Catálogo</button>

    </section>

    <section class="filtros">

        <h2></h2>

        <button>Favoritos</button>

        <button>Minhas avaliações</button>

        <button>Recomendações</button>

    </section>

    <section class="destaques">

        <h2>Em Destaque</h2>

        <div class="cards">

            <div class="card">

                <img src="../assets/interstelar.webp" alt="Poster" class="poster1">

                <p>Interestelar</p>

            </div>

            <div class="card">

                <img src="../assets/" alt="Poster" class="poster2">

                <p>Homem Aranha</p>

            </div>

            <div class="card">

                <img src="../assets/" alt="Poster" class="poster3">

                <p>John Wick</p>

            </div>

        </div>

    </section>

    <footer>

        <p>© 2026 CineTrack - Todos os direitos reservados</p>

    </footer>
</body>
</html>
